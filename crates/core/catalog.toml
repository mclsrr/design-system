[[apps.details.features]]
title = "Native GPU canvas"
text = "No Electron and no web view: a fast native compositor."
[[apps.details.features]]
title = "Real layered files"
text = "Opens and saves layered PSD and PSB documents."
[[apps.details.features]]
title = "Non-destructive editing"
text = "Adjustment layers, live-preview filters, smart objects and layer styles."

