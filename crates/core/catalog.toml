# Design System: the apps this launcher lists, installs and updates.
#
# Each app is a GitHub repository under mclsrr whose releases carry the Windows installer as
#   <id>-<version>-windows-x64.msi   (and a SHA256SUMS.txt with its checksum)
# The launcher reads only GitHub (no other catalog or feed). To add an app:
#   1. Copy an [[apps]] block below and change id, name, tagline, colors and repo.
#   2. Put its 128 px icon at assets/app-icons/<id>.png (the Craft apps' icons are already there).
#   3. Publish a new Design System release: every installed launcher updates itself and shows the
#      new app. See GUIA_GITHUB.md.
#
# Fields: id = repo, binary and asset name (lowercase); name = display name; repo = "owner/name";
# kind = "official" (yours) or "community"; msi_publisher = the Manufacturer its MSI records.

