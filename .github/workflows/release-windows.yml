# Publishes a Design System release on mclsrr/design-system: the download people start from, and the
# update every installed launcher installs itself (it looks for design-system-<version>-windows-x64.msi).
#
# How to release: raise [workspace.package] version in Cargo.toml (and add any new app to
# crates/core/catalog.toml), commit, then push a matching tag:
#   git tag v0.20.3   git push origin v0.20.3
# or run this workflow by hand from the Actions tab.
#
# Nothing is code-signed (no certificate secrets): Windows SmartScreen may warn the first time.

name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $inPkg = $false
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
            if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw 'no [workspace.package] version in Cargo.toml' }
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version (expected $tag)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Rust toolchain (rust-toolchain.toml)
        shell: pwsh
        run: rustup show active-toolchain || rustup toolchain install

      - name: WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Build and package (MSI and portable zip)
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\upload
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem upload -File | Where-Object { $_.Extension -notin '.msi', '.zip' } | Remove-Item
          $sums = Get-ChildItem upload -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD\upload\SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-ChildItem upload | Format-Table Name, Length

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem upload -File).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem upload -File).FullName --title "Design System ${{ steps.version.outputs.version }}" --generate-notes --target $env:GITHUB_SHA
          }
